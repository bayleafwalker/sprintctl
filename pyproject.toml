[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sprintctl"
version = "0.7.4"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "vuoro-adapter-kit @ https://github.com/bayleafwalker/vuoro/releases/download/vuoro-adapter-kit-v0.1.0/vuoro_adapter_kit-0.1.0-py3-none-any.whl#sha256=0037898a4c9f01720a42302365b0172ecd203732070326ea2abdf549a44bf0c2",
]

[project.scripts]
sprintctl = "sprintctl.cli:cli"
sprintctl-volatile-hook = "sprintctl.volatile_hook:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
remote = [
    "psycopg[binary]>=3.1",
]
# The served transport is distributed as an attested GitHub Release wheel.
# Pin both its immutable release URL and verified digest; no package index or
# mutable source checkout participates in installation.
served = [
    "vuoro-client @ https://github.com/bayleafwalker/vuoro/releases/download/vuoro-client-v0.1.1/vuoro_client-0.1.1-py3-none-any.whl#sha256=b5fb6bad174abd00d67504398690bcfb8c3cc3be891e5465983827e5a1740f6d ; python_version >= '3.12'",
]

[tool.setuptools]
packages = ["sprintctl", "sprintctl.commands"]

[tool.sprintctl]
capabilities = [
    "item-evidence-observations/v1",
    "normalized-scope-refs/v1",
    "portable-aggregate-uuid-json/v1",
    "remote-backend/v1",
    "remote-schema-compatibility/v1",
    "sprintctl-repository-ingest-cursor/v1",
    "volatile-context-item-projection/v1",
]
sqlite-schema-version = 25
remote-schema-version = 16

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "pg: requires an explicitly disposable PostgreSQL integration-test database",
    "perf: wall-clock timing assertion, sensitive to shared/contended hardware (item #2506) — deselected in ci.yml and release-sprintctl.yaml, run explicitly with `-m perf`",
]
