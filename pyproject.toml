[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sprintctl"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["click>=8.1"]

[project.scripts]
sprintctl = "sprintctl.cli:cli"

[project.optional-dependencies]
dev = ["pytest>=8"]
remote = [
    "psycopg[binary]>=3.1",
]
# vuoro-client has no release tag yet (only 0.1.0.dev0 in-tree); pinned by
# commit SHA to the revision verified against the deployed vuoro-shared
# service (commit 82c372b) as an interim measure. Replace with a proper
# `vuoro-client-vX.Y.Z` tag pin once the vuoro repo cuts one.
served = [
    "vuoro-client @ git+https://github.com/bayleafwalker/vuoro.git@82c372b2a222e0936e61510f1a96acb8e2fe3fc1#subdirectory=packages/vuoro-client ; python_version >= '3.12'",
]

[tool.setuptools]
packages = ["sprintctl"]

[tool.sprintctl]
capabilities = [
    "item-evidence-observations/v1",
    "normalized-scope-refs/v1",
    "portable-aggregate-uuid-json/v1",
    "remote-backend/v1",
    "remote-schema-compatibility/v1",
    "sprintctl-repository-ingest-cursor/v1",
]
sqlite-schema-version = 11
remote-schema-version = 3

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "pg: requires an explicitly disposable PostgreSQL integration-test database",
]
