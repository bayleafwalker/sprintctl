[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sprintctl"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["click>=8.1"]

[project.scripts]
sprintctl = "sprintctl.cli:cli"

[project.optional-dependencies]
dev = ["pytest>=8"]
remote = [
    "psycopg[binary]>=3.1",
]

[tool.setuptools]
packages = ["sprintctl"]

[tool.sprintctl]
capabilities = [
    "item-evidence-observations/v1",
    "normalized-scope-refs/v1",
    "portable-aggregate-uuid-json/v1",
    "remote-backend/v1",
]
sqlite-schema-version = 11
remote-schema-version = 1

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "pg: requires an explicitly disposable PostgreSQL integration-test database",
]
