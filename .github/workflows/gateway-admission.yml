name: Gateway admission test gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  gateway-admission:
    name: Gateway Admission (Python 3.12)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres-admin-ci-only
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRINTCTL_TEST_PG_URL: postgresql://sprintctl_test_ci:test-role-ci-only@127.0.0.1:5432/sprintctl_test_ci
    steps:
      - name: Checkout Sprintctl at the caller revision
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
      - name: Synchronize frozen gateway and PostgreSQL test dependencies
        run: uv sync --frozen --extra dev --extra remote --extra gateway-test
      - name: Require the pinned published gateway verifier
        run: >-
          uv run python -c "from importlib.metadata import version; import jwt;
          import vuoro_service.identity, vuoro_service.gateway_identity;
          assert version('vuoro-service') == '0.1.104'"
      - name: Run signed gateway resolver integration tests
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q -rs tests/test_recipient_admission_adapter.py tests/test_recipient_provenance.py tests/test_private_recipient_delivery_receiver.py | tee signed-gateway-pytest.out
          python3 - <<'PY'
          import re
          from pathlib import Path
          output = Path("signed-gateway-pytest.out").read_text()
          if not re.search(r"\b[1-9]\d* passed\b", output) or re.search(r"\b\d+ skipped\b", output):
              raise SystemExit("signed gateway tests must pass and may not skip")
          PY
      - name: Create disposable test database role
        env:
          PGPASSWORD: postgres-admin-ci-only
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres <<'SQL'
          CREATE ROLE sprintctl_test_ci LOGIN PASSWORD 'test-role-ci-only'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE DATABASE sprintctl_test_ci OWNER sprintctl_test_ci;
          COMMENT ON DATABASE sprintctl_test_ci IS 'sprintctl:disposable-integration-test';
          SQL
      - name: Run the private recipient-delivery ledger PostgreSQL gates
        shell: bash
        env:
          SPRINTCTL_TEST_PG_CLEANUP_REPORT: recipient-delivery-cleanup.jsonl
        run: |
          set -o pipefail
          rm -f "$SPRINTCTL_TEST_PG_CLEANUP_REPORT"
          uv run pytest -q -rs \
            tests/pg/test_recipient_binding.py::test_signed_delivery_replay_convergence_auth_and_restricted_read \
            tests/pg/test_recipient_binding.py::test_invalid_signed_admission_has_no_inbox_or_ledger_effect \
            tests/pg/test_recipient_binding.py::test_current_v1_declaration_cannot_receive_resolution_notification \
            tests/pg/test_recipient_binding.py::test_schema32_remains_compatible_but_private_delivery_fails_closed \
            tests/pg/test_recipient_binding.py::test_concurrent_same_logical_delivery_converges_on_one_message \
            tests/pg/test_recipient_binding.py::test_jti_conflict_rolls_back_message_counter_delivery_and_key \
            tests/pg/test_recipient_binding.py::test_authority_read_age_is_rechecked_after_waiting_on_jti_uniqueness \
            tests/pg/test_recipient_binding.py::test_historical_replay_rechecks_gateway_expiry_after_request_lock_wait \
            tests/pg/test_recipient_binding.py::test_private_adapter_rechecks_gateway_expiry_after_owner_lock_wait \
            tests/pg/test_private_delivery_receiver.py::test_signed_gateway_request_reaches_owner_and_dedupes_across_resolvers \
            | tee recipient-delivery-pg-pytest.out
          python3 - <<'PY'
          import re
          from pathlib import Path

          output = Path("recipient-delivery-pg-pytest.out").read_text(encoding="utf-8")
          if not re.search(r"\b12 passed\b", output):
              raise SystemExit("expected exactly 12 passed recipient-delivery cases")
          if re.search(r"\b\d+ (?:skipped|deselected)\b", output):
              raise SystemExit("recipient-delivery gates must have zero skipped or deselected cases")
          PY
          python3 scripts/pg-cleanup-report-check.py \
            "$SPRINTCTL_TEST_PG_CLEANUP_REPORT" recipient-delivery-pg-pytest.out
