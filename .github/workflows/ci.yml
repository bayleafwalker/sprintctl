name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
    steps:
      - name: Checkout sprintctl
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Sync dependencies
        run: uv sync --extra dev --extra served

      - name: Run full test suite
        # item #2506: wall-clock timing assertions in tests/test_perf.py are
        # marked `perf` and deselected here — they measured absolute ms
        # budgets on shared CI runners and flaked by up to 3 orders of
        # magnitude under contention. Run them on demand with
        # `uv run pytest -q -m perf`.
        run: uv run pytest -q -m "not perf"

  kctl-contract:
    name: Kctl Producer Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sprintctl
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run contract tests consumed by kctl
        run: >-
          uv run pytest -q
          tests/test_maintain.py
          tests/test_event_payload_contracts.py
          tests/test_knowledge.py
          tests/test_backlog_seed.py

  postgres-integration:
    name: PostgreSQL Integration (Disposable)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres-admin-ci-only
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRINTCTL_TEST_PG_URL: postgresql://sprintctl_test_ci:test-role-ci-only@127.0.0.1:5432/sprintctl_test_ci
      SPRINTCTL_TEST_PG_PRODUCTION_GUARD_URL: postgresql://sprintctl_production_probe:probe-role-ci-only@127.0.0.1:5432/sprintctl_test_ci
      SPRINTCTL_TEST_PG_CLEANUP_REPORT: pg-cleanup-report.json
    steps:
      - name: Checkout sprintctl
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Sync dependencies
        run: uv sync --extra dev --extra remote

      - name: Create dedicated disposable database and roles
        env:
          PGPASSWORD: postgres-admin-ci-only
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres <<'SQL'
          CREATE ROLE sprintctl_test_ci LOGIN PASSWORD 'test-role-ci-only'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE ROLE sprintctl_production_probe LOGIN PASSWORD 'probe-role-ci-only'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE DATABASE sprintctl_test_ci OWNER sprintctl_test_ci;
          COMMENT ON DATABASE sprintctl_test_ci IS 'sprintctl:disposable-integration-test';
          SQL

      # Same test selection as scripts/pg-disposable-tests.sh; output is
      # captured so the shared checker below can assert on it.
      - name: Run PostgreSQL integration suite
        shell: bash
        run: >-
          uv run pytest -q -m pg -rs tests/pg/ tests/test_work_application_pg.py
          tests/test_operator_request_pg.py tests/test_operator_request_revision_pg.py
          2>&1 | tee pg-pytest.out

      - name: Check cleanup evidence
        run: python3 scripts/pg-cleanup-report-check.py "$SPRINTCTL_TEST_PG_CLEANUP_REPORT" pg-pytest.out

      - name: Upload cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-integration-cleanup-evidence
          path: pg-cleanup-report.json
          if-no-files-found: error

  gateway-admission:
    name: Gateway Admission (Python 3.12)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres-admin-ci-only
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRINTCTL_TEST_PG_URL: postgresql://sprintctl_test_ci:test-role-ci-only@127.0.0.1:5432/sprintctl_test_ci
    steps:
      - name: Checkout sprintctl
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Sync gateway and PostgreSQL test dependencies
        run: uv sync --extra dev --extra remote --extra gateway-test

      - name: Require the pinned published gateway verifier
        run: >-
          uv run python -c "from importlib.metadata import version; import jwt;
          import vuoro_service.identity, vuoro_service.gateway_identity;
          assert version('vuoro-service') == '0.1.104'"

      - name: Run signed gateway resolver integration tests
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q -rs tests/test_recipient_admission_adapter.py tests/test_recipient_provenance.py | tee signed-gateway-pytest.out
          python3 - <<'PY'
          import re
          from pathlib import Path
          output = Path("signed-gateway-pytest.out").read_text()
          if not re.search(r"\b[1-9]\d* passed\b", output) or re.search(r"\b\d+ skipped\b", output):
              raise SystemExit("signed gateway tests must pass and may not skip")
          PY

      - name: Create disposable test database role
        env:
          PGPASSWORD: postgres-admin-ci-only
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres <<'SQL'
          CREATE ROLE sprintctl_test_ci LOGIN PASSWORD 'test-role-ci-only'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE DATABASE sprintctl_test_ci OWNER sprintctl_test_ci;
          COMMENT ON DATABASE sprintctl_test_ci IS 'sprintctl:disposable-integration-test';
          SQL

      - name: Run the lock-wait credential-expiry PostgreSQL regression
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q -rs tests/pg/test_recipient_binding.py::test_private_adapter_rechecks_gateway_expiry_after_owner_lock_wait | tee gateway-expiry-pg-pytest.out
          python3 - <<'PY'
          import re
          from pathlib import Path
          output = Path("gateway-expiry-pg-pytest.out").read_text()
          if not re.search(r"\b1 passed\b", output) or re.search(r"\b\d+ skipped\b", output):
              raise SystemExit("gateway expiry PostgreSQL regression must pass and may not skip")
          PY
